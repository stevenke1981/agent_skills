name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # The setup and search scripts call powershell.exe and Windows paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the shared runtime pinned in config/runtime.json.
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install pyyaml==6.0.3 ruff==0.15.20 pytest
      - name: Lint
        run: python -m ruff check scripts tests
      - name: Test
        run: python -m pytest -q tests
